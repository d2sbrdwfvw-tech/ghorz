  --good:#a3bd8b; --good-soft:#26301e; --warn:#e0b26a; --warn-soft:#3a2c17; --bad:#ec9a8c; --bad-soft:#3d2320;
  --demo:#b7c49f; --demo-soft:#2a3020;
  --logo-bg:var(--gold); --logo-mask:var(--logo-1c) center/contain no-repeat; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
#app{direction:rtl;max-width:480px;min-height:100%;margin:0 auto;background:var(--app);position:relative;box-shadow:0 0 0 1px var(--line)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .pad{display:flex;align-items:center;gap:8px;min-height:54px;padding-block:6px}
.appbar h1{font-family:var(--f-display);font-size:1.2rem;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:0;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px}
.demo-badge{background:var(--demo-soft);color:var(--demo);font-weight:600;font-size:.72rem;padding:3px 9px;border-radius:999px;white-space:nowrap}

main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
main.no-nav{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}

/* bottom tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{display:flex;height:var(--nav-h)}
.tabbar button{flex:1;background:none;border:0;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:500;position:relative;min-width:0}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:8px;inset-inline-end:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:.65rem;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-size:1.12rem;font-weight:600}
h3{font-size:.98rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 0 -4px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:.86rem;padding:0;font-weight:500}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.84rem;font-weight:500;border-radius:9px}
.btn.wide{width:100%}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.demo{background:var(--demo-soft);color:var(--demo)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.8rem;color:var(--muted);font-weight:500}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=number]{direction:ltr;text-align:right}
.note{font-size:.84rem;padding:10px 12px;border-radius:10px;background:var(--sunk);color:var(--muted);margin:0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}
.note.demo{background:var(--demo-soft);color:var(--demo)}
.empty{color:var(--muted);padding:28px 0;text-align:center}

/* login */
.login{min-height:100%;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:40px calc(32px + env(safe-area-inset-bottom,0px))}
.mark{width:84px;height:110px;margin:0 auto;border-radius:20px;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden}
.mark svg{width:70px;height:100px}
.login h1{font-family:var(--f-display);font-size:1.5rem;font-weight:600;text-align:center;margin:0}
.login .tag{text-align:center;color:var(--muted);margin:-14px 0 0}
.phone{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);direction:ltr}
.phone span{padding:11px 12px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.phone input{border:0;border-radius:0;font-size:1.1rem;letter-spacing:.06em;direction:ltr;text-align:left}
.otp{font-size:1.6rem!important;letter-spacing:.6em;text-align:center!important;direction:ltr}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* home */
.hero{background:var(--cocoa);color:var(--ivory);border-radius:18px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:10px;align-items:center;overflow:hidden}
.hero h2{color:inherit;font-size:1.3rem;line-height:1.35}
.hero p{margin:6px 0 12px;opacity:.85;font-size:.88rem}
.hero .btn{background:var(--ivory);color:var(--cocoa);border-color:var(--ivory)}
.hero .logo-1c{opacity:.95}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;font-weight:500;text-align:center;line-height:1.3}
.quick svg{width:26px;height:26px;color:var(--accent)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.mini-fab{flex:none;width:118px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:start;padding:0}
.mini-fab .sw{height:70px;background-color:var(--sw);position:relative}
.mini-fab div.t{padding:7px 9px;font-size:.78rem;line-height:1.35}

/* catalogue */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters select{width:auto;flex:none;border-radius:999px;padding:6px 12px;font-size:.84rem}
.fabrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fab{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.swatch,.mini-fab .sw{position:relative}
.swatch{aspect-ratio:4/3;max-width:100%;background-color:var(--sw)}
.swatch::after,.mini-fab .sw::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.045) 0 1px,transparent 1px 4px),repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 1px,transparent 1px 5px)}
.demo-tag{position:absolute;z-index:1;top:6px;inset-inline-start:6px;background:rgba(20,20,30,.62);color:#fff;font-size:.64rem;padding:1px 7px;border-radius:999px}
.fab-body{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;color:var(--muted);letter-spacing:.03em}
.price{font-weight:600}
.fab .btn{margin-top:8px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet .swatch{aspect-ratio:16/9}
dl.specs{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.88rem}
dl.specs dt{color:var(--muted)}
dl.specs dd{margin:0}

/* designer */
.stage{position:relative;height:330px;border-radius:16px;overflow:hidden;background:var(--sunk);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;background-position:center}
.stage svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .25s ease;transform-origin:50% 30%}
.stage-ctl{position:absolute;bottom:10px;inset-inline:10px;display:flex;justify-content:space-between;gap:8px;z-index:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:1px;line-height:1.35}
.chip small{color:var(--muted);font-size:.74rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chip[disabled]{cursor:not-allowed;opacity:.55}
.sw-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;flex:none}
.sw-btn[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw-btn[disabled]{opacity:.3;cursor:not-allowed}
.bill{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.9rem}
.bill .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.qty button{background:none;border:0;width:34px;height:34px;cursor:pointer;font-size:1.1rem}
.qty span{min-width:30px;text-align:center}
.sticky-buy{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.08)}

.sticky-buy .btn{flex:1;white-space:nowrap}
/* staff app chrome */
.staff-app .appbar{background:var(--cocoa);color:var(--ivory);border-bottom-color:var(--cocoa)}
.staff-app .appbar .icon-btn{color:var(--ivory)}
.staff-app .appbar .demo-badge{background:rgba(238,230,219,.16);color:var(--ivory)}
.ms-sheet{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ms-row{display:grid;grid-template-columns:22px minmax(0,1fr) 104px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:text}
.ms-row:last-child{border-bottom:0}
.ms-row .n{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.68rem}
.ms-row .t{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.ms-row .l{font-weight:600;font-size:.9rem}
.ms-row small{color:var(--muted);font-size:.72rem}
.ms-row .in{position:relative;display:block;direction:ltr;min-width:0}
.ms-row input{width:100%;box-sizing:border-box;-moz-appearance:textfield;appearance:textfield}
.ms-row input::-webkit-outer-spin-button,.ms-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ms-row input{padding-left:8px!important;padding-right:32px!important;text-align:center!important;font-size:1rem;font-variant-numeric:tabular-nums}
.ms-row .in i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.72rem;color:var(--muted);pointer-events:none}
.ms-row:focus-within{background:var(--accent-soft)}
.ms-group{font-size:.86rem;color:var(--gold);margin:6px 0 -2px;font-weight:600}
.opt{font-style:normal;font-size:.68rem;color:var(--muted);background:var(--sunk);padding:0 6px;border-radius:999px;margin-inline-start:4px}
.seasons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.season{display:flex;flex-direction:column;text-align:start;padding:0;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink)}
.season .strip{display:flex;height:84px}
.season .strip i{flex:1;border-inline-end:1px solid rgba(0,0,0,.06)}
.season .strip i:last-child{border:0}
.season .sb{display:flex;flex-direction:column;gap:3px;padding:12px 12px 14px;position:relative}
.season .sb::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--gold)}
.season.winter .sb::before{background:var(--cocoa)}
.season b{font-size:1rem}
.season small{color:var(--muted);font-size:.76rem;line-height:1.4}
.season .cnt{margin-top:4px;font-size:.76rem;color:var(--gold);font-weight:600}
/* design steps */
.steps{display:flex;gap:6px}
.steps>*{flex:1;text-align:center;padding:7px 6px;border-radius:999px;background:var(--sunk);color:var(--muted);font-size:.82rem;font-weight:500;border:0;cursor:pointer}
.steps .on{background:var(--accent);color:var(--accent-ink);cursor:default}
.pick{display:flex;flex-direction:column;gap:8px}
.pick-fab,.fab-chosen{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:start;width:100%}
.pick-fab[disabled]{opacity:.5;cursor:not-allowed}
.pick-fab .sw,.fab-chosen .sw{width:44px;height:44px;border-radius:10px;background:var(--sw);border:1px solid var(--line);flex:none}
.pick-fab .t,.fab-chosen .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.opt-row{display:flex;flex-direction:column;gap:6px}
.opt-row .lbl{font-weight:600;font-size:.92rem}
.seg.two{display:flex}
.seg.two button{flex:1;padding:10px 8px;font-size:.88rem}
.seg.two button small{opacity:.75;font-size:.72rem}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list>*{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start;cursor:pointer;color:inherit}
.list>*:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list svg.ch{width:18px;height:18px;color:var(--muted);flex:none;transform:scaleX(-1)}
.line{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line:first-child{padding-top:0}.line:last-child{border-bottom:0;padding-bottom:0}
.mini{width:52px;height:66px;border-radius:9px;background:var(--sunk);overflow:hidden}
.mini svg{width:100%;height:100%}
.radio-list{display:flex;flex-direction:column;gap:6px}
.radio-list label{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;justify-content:space-between;background:var(--surface)}
.radio-list label>span{display:flex;gap:8px;align-items:center}
.radio-list label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.confirm{border:1px solid var(--good);background:var(--good-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.prog{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.ref{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;direction:ltr;unicode-bidi:isolate}

/* vertical timeline */
.vtrack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vtrack li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:.88rem;color:var(--muted);position:relative;padding-bottom:12px}
.vtrack li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:5px;z-index:1}
.vtrack li::after{content:"";position:absolute;top:19px;bottom:-2px;inset-inline-start:7px;width:2px;background:var(--line)}
.vtrack li:last-child::after{display:none}
.vtrack li.done{color:var(--ink)}
.vtrack li.done::before{background:var(--accent);border-color:var(--accent)}
.vtrack li.done::after{background:var(--accent)}
.vtrack li.cur{color:var(--ink);font-weight:600}
.vtrack li.cur::before{background:var(--warn);border-color:var(--warn)}

/* measurements */
.guide{background:var(--sunk);border-radius:14px;padding:8px}
.guide svg{width:100%;height:auto;max-height:300px;display:block}
.m-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.m-fields .fld>span b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.7rem;margin-inline-end:5px}
.m-fields small{color:var(--muted);font-size:.72rem;line-height:1.4}
.vals{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.8rem;color:var(--muted)}

/* admin */
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:.84rem;color:var(--muted);white-space:nowrap}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--app);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{color:var(--muted);font-size:.78rem}
.kpi b{display:block;font-size:1.15rem;font-weight:600;margin-top:2px}
.kpi small{color:var(--muted);font-size:.74rem}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 22px;gap:8px;align-items:center;font-size:.82rem}
.bar .t{height:11px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.alert-list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.alert-list li{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.alert-list li:last-child{border-bottom:0}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:.84rem;min-width:520px}
.tbl th,.tbl td{padding:8px 11px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-weight:600;color:var(--muted);font-size:.75rem;background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-variant-numeric:tabular-nums}
.tbl input[type=number]{width:100px}
.orders{display:flex;flex-direction:column;gap:8px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;border-inline-start:4px solid var(--line)}
.order.is-late{border-inline-start-color:var(--bad)}
.order.is-done{border-inline-start-color:var(--good)}
.order.is-cancel{opacity:.7}
.order-row{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 13px;align-items:center}
.order-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.od{border-top:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:12px;background:var(--app)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.box h3{font-size:.88rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.85rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:end}
.gate{font-size:.8rem;color:var(--warn);margin:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.form-grid .full{grid-column:1/-1}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.84rem}
.log li:last-child{border-bottom:0}
.log .meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.76rem}
.check{display:flex;gap:8px;align-items:center}

#toast{position:fixed;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--app);padding:10px 16px;border-radius:12px;font-size:.88rem;width:max-content;max-width:min(92vw,440px);box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center}
#toast.bad{background:var(--bad);color:#fff}

/* brand: logo, Sadu pattern, gold details */
.logo{display:block;aspect-ratio:272/359;max-width:100%;background:var(--logo-bg);-webkit-mask:var(--logo-mask);mask:var(--logo-mask)}
.logo-1c{display:block;aspect-ratio:272/359;max-width:100%;background:currentColor;-webkit-mask:var(--logo-1c) center/contain no-repeat;mask:var(--logo-1c) center/contain no-repeat}
.sadu{position:relative;isolation:isolate}
.sadu::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--gold);opacity:.13;-webkit-mask:var(--sadu) repeat;mask:var(--sadu) repeat;pointer-events:none}
.prog i,.bar .t i{background:var(--gold)}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"]::before{background:var(--gold)}
.btn.olive{background:var(--olive);border-color:var(--olive);color:#fff}
.link{color:var(--gold)}
.appbar h1{font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const mir=pts=>pts.map(([x,y])=>[200-x,y]);
const poly=pts=>'M'+pts.map(p=>p.join(',')).join(' L')+' Z';
function thobeSVG(hex,o,view){
  const dark=lum(hex)<.5,d=dark?'rgba(255,255,255,.55)':'rgba(25,30,40,.5)',st=dark?'rgba(255,255,255,.28)':'rgba(25,30,40,.32)';
  let s=`<svg viewBox="0 0 200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="معاينة الثوب"><defs><pattern id="wv" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0,4 L4,0" stroke="${dark?'rgba(255,255,255,.05)':'rgba(0,0,0,.035)'}" stroke-width="1"/></pattern></defs>`;
  s+=`<path d="${BODY}" fill="${hex}" stroke="${st}" stroke-width="1.5" stroke-linejoin="round"/><path d="${BODY}" fill="url(#wv)"/>`;
  const line=`fill="none" stroke="${d}" stroke-width="1.1"`;
  const inner=x=>`<rect x="${x}" y="200" width="13" height="16" rx="1.5" fill="none" stroke="${d}" stroke-width="1" stroke-dasharray="2 1.6"/>`;
  if(view==='front'){
    s+=`<rect x="96" y="50" width="8" height="78" rx="1" ${line}/>`;
    if(o.closure==='z2'){s+=`<path d="M102.4,53 L102.4,126" stroke="${d}" stroke-width=".6" stroke-dasharray="1.6 1.2"/>`}
    else [70,88,106,124].forEach(y=>s+=`<circle cx="100" cy="${y}" r="2.3" fill="${d}"/>`);
    if(o.collar==='c2'){
      s+=`<path d="M80,42 Q100,29 120,42 L117,46 Q100,37 83,46 Z" fill="${hex}" stroke="${d}" stroke-width="1"/>`;
      s+=`<path d="M80,42 Q89,46 98.5,48 L93,65 Q85,58 75.5,51 Z" fill="${hex}" stroke="${d}" stroke-width="1.2" stroke-linejoin="round"/>`;
      s+=`<path d="M120,42 Q111,46 101.5,48 L107,65 Q115,58 124.5,51 Z" fill="${hex}" stroke="${d}" stroke-width="1.2" stroke-linejoin="round"/>`;
      s+=`<path d="M81,45 Q89,48.5 97,50.5 M119,45 Q111,48.5 103,50.5" fill="none" stroke="${d}" stroke-width=".6" stroke-dasharray="1.4 1.2"/>`;
      s+=`<circle cx="100" cy="47" r="1.6" fill="${d}"/>`;
    }else s+=`<path d="M86,45 Q100,55 114,45 L114,35 Q100,45 86,35 Z" fill="${hex}" stroke="${d}" stroke-width="1.2"/>`;
    s+=o.front==='f2'?`<path d="M117,100 L135,100" stroke="${d}" stroke-width="1" stroke-dasharray="2 2"/>`
                     :`<path d="M116,97 L136,97 L136,117 Q126,121 116,117 Z" ${line}/><path d="M116,101 L136,101" stroke="${d}" stroke-width=".8"/>`;
    s+=`<path d="M64,192 L65,230 M136,192 L135,230" stroke="${d}" stroke-width="1.6"/>`;
    if(o.right==='r1')s+=inner(68);
    if(o.left==='l1')s+=inner(119);
  }else{
    s+=o.collar==='c2'?`<path d="M78,47 Q100,56 122,47 L120,38 Q100,46 80,38 Z" fill="${hex}" stroke="${d}" stroke-width="1.2"/><path d="M80,42 Q100,50 120,42" fill="none" stroke="${d}" stroke-width=".7"/>`
                      :`<path d="M86,45 Q100,51 114,45 L114,37 Q100,43 86,37 Z" fill="${hex}" stroke="${d}" stroke-width="1.2"/>`;
    s+=`<path d="M62,58 Q100,76 138,58" ${line}/>`;
  }
  if(o.sleeve==='s1'){s+=`<path d="M23,196 L48.4,199.6 M177,196 L151.6,199.6" stroke="${d}" stroke-width=".8"/>`}
  else{
    const heavy=o.sleeve==='s3',h=heavy?17:10.5,st=`fill="none" stroke="${d}" stroke-width=".55" stroke-dasharray="1.3 1"`;
    let g=`<path d="M-4.5,${-h-23} L-4.5,${-h} M-8.5,${-h-21} L-8.5,${-h} M-8.5,${-h-21} L-6.5,${-h-24} L-4.5,${-h-21}" fill="none" stroke="${d}" stroke-width=".8"/>`;
    g+=`<circle cx="-6.5" cy="${-h-12}" r="1.1" fill="${d}"/>`;
    g+=`<path d="M1,${-h} q1.5,-5 0,-9 M7,${-h} q1.5,-4.5 0,-8" fill="none" stroke="${d}" stroke-width=".6"/>`;
    g+=`<rect x="-15" y="${-h}" width="30" height="${h+1.5}" rx="2.2" fill="${hex}" stroke="${d}" stroke-width="${heavy?1.4:1.1}"/>`;
    g+=`<rect x="-13.5" y="${-h+1.5}" width="27" height="${h-1.5}" rx="1.4" ${st}/>`;
    if(heavy)g+=`<rect x="-12" y="${-h+3}" width="24" height="${h-4.5}" rx="1" ${st}/>`;
    g+=`<path d="M-15,${-h+1} L-15,1.5" stroke="${d}" stroke-width="1.2"/>`;
    (heavy?[[-10.5,-h/2-3],[-10.5,-h/2+3.5]]:[[-10.5,-h/2+.7]]).forEach(([x,y])=>{g+=`<circle cx="${x}" cy="${y}" r="1.9" fill="${hex}" stroke="${d}" stroke-width=".9"/><circle cx="${x}" cy="${y}" r=".45" fill="${d}"/>`});
    const arm=`<g transform="translate(35,201.6) rotate(8.75)">${g}</g>`;
    s+=arm+`<g transform="translate(200,0) scale(-1,1)">${arm}</g>`;
  }
  return s+'</svg>';
}
function guideSVG(){
  const a='stroke="var(--accent)" stroke-width="1.6"';
  const n=(x,y,k)=>`<circle cx="${x}" cy="${y}" r="7" fill="var(--accent)"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--accent-ink)">${k}</text>`;
  return `<svg viewBox="-6 10 218 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="دليل أخذ المقاسات"><path d="${BODY}" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.2"/>
  <path d="M198,44 L198,342 M193,44 L203,44 M193,342 L203,342" ${a}/>${n(198,190,1)}
  <path d="M40,64 L160,64" ${a} stroke-dasharray="4 3"/>${n(100,64,2)}
  <path d="M60,120 L140,120" ${a}/>${n(100,120,3)}
  <path d="M58,190 L142,190" ${a}/>${n(100,190,4)}
  <path d="M33,72 L15,198" ${a}/>${n(22,130,5)}
  <ellipse cx="100" cy="43" rx="15" ry="5" fill="none" ${a}/>${n(122,34,6)}
  <path d="M22,209 L48,213" ${a}/>${n(35,222,7)}</svg>`;
}

  if(L.step==='otp')return `<div class="login pad sadu">${mark}<h1>رمز التحقق</h1><p class="tag">أرسلنا رمزاً من 4 أرقام إلى <span class="num">+966 ${esc(L.phone)}</span></p>

    ${staff?`<div class="fld"><span>الدخول بصلاحية (تجربة الأدوار)</span><div class="roles">${Object.entries(ROLES).map(([k,l])=>`<button class="chip" data-act="login-role" data-id="${k}" aria-pressed="${L.role===k}"><span>${l}</span></button>`).join('')}</div></div>`:''}

function newDraft(fid){return{fabricId:fid||null,opts:{...DEF_OPTS},qty:1,view:'front',zoom:1}}
const myOrders=()=>[...S.orders].sort((a,b)=>b.created-a.created);

function cartLines(){return S.cart.map(it=>({...it,unit:unitPrice(it),meters:r2(S.settings.metersPerThobe*it.qty)}))}

  const lines=cartLines(),fee=cartFee(),t=totals(lines,fee),req=required(t.total,ui.payMode),p=S.profiles.find(x=>x.id===ui.cartProfile);
  const need={};lines.forEach(l=>need[l.fabricId]=r2((need[l.fabricId]||0)+l.meters));
  const short=Object.keys(need).filter(id=>avail(fab(id))<need[id]);
  return `<div class="stack">
   <div class="panel">${lines.map(l=>{const f=fab(l.fabricId);return`<div class="line"><div class="mini">${thobeSVG(f.hex,l.opts,'front')}</div>

     <b style="white-space:nowrap">${money(l.unit*l.qty)}</b></div>`}).join('')}</div>
   <label class="fld" for="c-profile"><span>ملف المقاسات</span><select id="c-profile" data-ch="cart-profile">${S.profiles.map(x=>`<option value="${x.id}" ${x.id===ui.cartProfile?'selected':''}>${esc(x.name)} (${METHOD[x.method]})</option>`).join('')}</select></label>

function tailorStats(t){

}

  if(!(x>=mn&&x<=mx)){toast(`${l}: أدخل قيمة بين ${mn} و${mx} سم`,'bad');$(`#${prefix}-${k}`).focus();return null}v[k]=x}
  return{values:v,fit:$(`#${prefix}-fit`).value,tailorNote:$(`#${prefix}-tnote`).value.trim()}}

   if(!code||!g('brand')||!g('type')||!g('color'))return toast('أكمل كل الحقول','bad');if(S.fabrics.some(f=>f.code===code))return toast('الرمز مستخدم','bad');if(!(price>=0))return toast('أدخل السعر','bad');
   S.fabrics.push({id:'f'+Date.now(),season:$('#nf-season').value,code,brand:g('brand'),type:g('type'),color:g('color'),hex:$('#nf-hex').value,price,stock:0,reserved:0,desc:'وصف تجريبي.',specs:{}});log('مخزون',`إضافة قماش ${code} بمخزون 0 م`);save();toast('أُضيف القماش. سجّل شراء لإضافة الكمية')},
 't-add':()=>{const n=$('#nt').value.trim();if(!n)return toast('أدخل الاسم','bad');S.tailors.push({id:'t'+Date.now(),name:n});log('نظام',`إضافة الخياط ${n}`);save()},
 'b-ok':id=>{const b=S.bookings.find(x=>x.id===id);b.status='approved';log('حجز',`تأكيد زيارة ${b.date} ${b.slot}`);save()},
 'b-no':id=>{const b=S.bookings.find(x=>x.id===id);b.status='rejected';log('حجز',`رفض زيارة ${b.date} ${b.slot}`);save()},
 install:()=>{if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}},
 'install-hide':()=>{try{localStorage.setItem('ghorz-install-hide','1')}catch(e){}},
 reset:()=>{ui.confirm='reset'},
 'reset-yes':()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;seed();save();Object.assign(ui,{confirm:null,openOrder:null,d:null,lastOrder:null});toast('أُعيد ضبط البيانات')}
};
const CH={
 filter:t=>{ui.flt[t.dataset.k]=t.value},
 'cart-profile':t=>{ui.cartProfile=t.value},
 del:t=>{ui.del=t.value},
 pay:t=>{ui.payMode=t.value},
 tailor:t=>{const o=ord(t.dataset.id);o.tailorId=t.value||null;log('طلب',`${o.ref}: تعيين الخياط ${t.value?S.tailors.find(x=>x.id===t.value).name:'—'}`);save()},
 qc:t=>{const o=ord(t.dataset.id);o.qc=t.value;log('طلب',`${o.ref}: ملاحظة فحص الجودة`);save()},
 logf:t=>{ui.logF=t.value}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(!f)return;if(f(b.dataset.id,b,e)!==false)render()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='ph'){if(ACT['login-send']()!==false)render()}else if(e.target.id==='otp'){if(ACT['otp-verify']()!==false)render()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.path){let v;
    if(t.type==='checkbox')v=t.checked;
    else if(t.dataset.kind==='text'){v=t.value}
    else if(t.dataset.kind==='lines'){v=t.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!v.length){toast('أدخل موعداً واحداً على الأقل','bad');return render()}}
    else{v=parseFloat(t.value);if(!isFinite(v)||v<0||(t.max&&v>+t.max)||(t.dataset.path==='settings.depositPct'&&v<1)||(t.dataset.path==='settings.metersPerThobe'&&v<=0)||(t.dataset.path==='settings.dueDays'&&(v<1||v!==Math.round(v)))){toast('قيمة غير صحيحة','bad');return render()}}
    const old=setPath(t.dataset.path,v);log('إعدادات',`${t.dataset.label}: ${Array.isArray(old)?old.join('، '):old} ← ${Array.isArray(v)?v.join('، '):v}`);save();toast('حُفظ التغيير');return render()}
  if(t.dataset.ch&&CH[t.dataset.ch]){CH[t.dataset.ch](t);render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(SES)render()});
window.addEventListener('appinstalled',()=>{installEvt=null;render()});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=JSON.parse(e.newValue);migrate();render()}catch(err){}}});
window.addEventListener('hashchange',()=>{loadSes();Object.assign(ui,{tab:'home',sub:null,openOrder:null,confirm:null});render()});
load();render();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
